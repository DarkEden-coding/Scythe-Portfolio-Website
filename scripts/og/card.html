<!doctype html>
<!-- Source for public/og.jpg, the 1200×630 link-preview image. See "Search and link previews" in the README. -->
<html lang="en">
<head>
<meta charset="utf-8" />
<style>
  @font-face { font-family: 'Geist Variable'; src: url('../../node_modules/@fontsource-variable/geist/files/geist-latin-wght-normal.woff2') format('woff2'); font-weight: 100 900; }
  @font-face { font-family: 'Geist Mono Variable'; src: url('../../node_modules/@fontsource-variable/geist-mono/files/geist-mono-latin-wght-normal.woff2') format('woff2'); font-weight: 100 900; }
  /* Colours and card styling from src/styles.css */
  :root {
    --bg: #1c1c1f; --card-glass: rgba(38, 38, 42, 0.72); --card-border: rgba(255, 255, 255, 0.07);
    --shadow: 0 1px 0 rgba(255, 255, 255, 0.04) inset, 0 2px 6px rgba(0, 0, 0, 0.22), 0 18px 40px -12px rgba(0, 0, 0, 0.55);
    --ink: #edece9; --muted: #9a9995; --soft: #b9b8b3; --faint: #6c6b68; --line: rgba(255, 255, 255, 0.07);
    --sans: 'Geist Variable', sans-serif; --mono: 'Geist Mono Variable', monospace;
  }
  html, body { margin: 0; }
  body {
    width: 1200px; height: 630px; overflow: hidden; position: relative;
    /* cube.jpg is the live hero at 1200×630 (2x) with the UI hidden; scaled up and moved right */
    background: var(--bg) url('cube.jpg') no-repeat 99px -85px / 1524px auto;
    color: var(--ink); font: 400 15px/1.5 var(--sans); -webkit-font-smoothing: antialiased;
  }
  .card {
    position: absolute; background: var(--card-glass); border: 1px solid var(--card-border);
    box-shadow: var(--shadow); backdrop-filter: blur(18px) saturate(1.2);
  }
  .mono { font-family: var(--mono); }

  .nav { left: 40px; top: 32px; height: 68px; padding: 0 30px 0 26px; border-radius: 999px; display: flex; align-items: center; gap: 30px; }
  .nav__brand { display: flex; align-items: center; gap: 12px; }
  .nav__brand img:first-child { width: 40px; }
  .nav__brand img:last-child { width: 158px; }
  .nav__url { font-size: 21px; color: var(--soft); padding-left: 30px; border-left: 1px solid var(--line); line-height: 34px; }

  .id-card { left: 40px; bottom: 40px; width: 580px; padding: 34px 40px 30px; border-radius: 24px; box-sizing: border-box; }
  .id-card h1 { margin: 0 0 0 -0.04em; font-family: var(--mono); font-size: 84px; line-height: 0.95; font-weight: 500; letter-spacing: -0.04em; }
  .id-card__sub { margin: 20px 0 0; color: var(--muted); font-size: 23px; line-height: 1.4; }
  .id-card__sub b { color: var(--soft); font-weight: 400; text-decoration: underline; text-decoration-color: var(--faint); text-underline-offset: 4px; }
  .id-card__facts { margin-top: 22px; padding-top: 16px; border-top: 1px solid var(--line); display: flex; gap: 44px; font-size: 18px; line-height: 1.45; }
  .id-card__facts dt { color: var(--faint); }
  .id-card__facts dd { margin: 0; }
</style>
</head>
<body>
  <div class="card nav">
    <div class="nav__brand"><img src="../../public/brand/mark-red.png" alt="" /><img src="../../public/brand/wordmark-white.png" alt="" /></div>
    <span class="nav__url mono">elliotscully.dev</span>
  </div>

  <div class="card id-card">
    <h1>Elliot Scully</h1>
    <p class="id-card__sub">Currently at <b>Speechify</b>. UMich student working in vision, machine learning and tools.</p>
    <dl class="id-card__facts mono">
      <div><dt>GitHub</dt><dd>DarkEden-coding</dd></div>
      <div><dt>Based in</dt><dd>Ann Arbor, Michigan</dd></div>
    </dl>
  </div>
</body>
</html>
