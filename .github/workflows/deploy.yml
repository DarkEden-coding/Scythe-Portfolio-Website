# Publishing a GitHub release builds the site and deploys it to the Cloudflare Worker serving
# elliotscully.dev. The baked cubes aren't in git; they come from the "cubes" release.
name: Deploy

on:
  release:
    types: [published]

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    # The "cubes" release only stores the baked cube files; it isn't a site release.
    if: github.event.release.tag_name != 'cubes'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Fetch the baked cubes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download cubes --pattern cubes.tar --dir "$RUNNER_TEMP"
          mkdir -p public/cubes
          tar -xf "$RUNNER_TEMP/cubes.tar" -C public/cubes

      - run: npm test

      - run: npm run build

      - name: Deploy to Cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy
